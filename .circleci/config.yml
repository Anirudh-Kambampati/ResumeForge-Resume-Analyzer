# CircleCI pipeline: runs on every push to any branch.
#   backend-tests   — pytest against a clean Python 3.12
#   frontend-checks — npm ci, lint (report only), next build
#   docker-build    — builds both Docker images, once the two above pass
# Nothing is deployed yet; this only tells you whether a commit is healthy.

version: 2.1

jobs:
  backend-tests:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/repo/backend
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements.txt" }}
            - pip-v1-
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt pytest
      - save_cache:
          key: pip-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run tests
          # test_analyze.py is a manual script that calls a live server on :8000.
          command: |
            mkdir -p ~/test-results
            python -m pytest --ignore=test_analyze.py --junitxml="$HOME/test-results/junit.xml"
      - store_test_results:
          path: ~/test-results

  frontend-checks:
    docker:
      - image: node:24
    working_directory: ~/repo/frontend
    steps:
      - checkout:
          path: ~/repo
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint (report only)
          # The codebase has existing lint errors. Remove `|| true` once they
          # are fixed so new ones fail the build.
          command: npm run lint || true
      - run:
          name: Build
          command: npm run build
          environment:
            NEXT_TELEMETRY_DISABLED: "1"

  docker-build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      # Gives the job access to a Docker engine to build images with.
      - setup_remote_docker
      - run:
          name: Build backend image
          command: docker build -t resumeforge-backend:${CIRCLE_SHA1} ./backend
      - run:
          name: Build frontend image
          command: docker build -t resumeforge-frontend:${CIRCLE_SHA1} ./frontend

workflows:
  ci:
    jobs:
      - backend-tests
      - frontend-checks
      - docker-build:
          requires:
            - backend-tests
            - frontend-checks
